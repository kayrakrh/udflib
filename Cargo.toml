[package]
name = "udflib"
version = "0.1.0"
edition = "2021"
description = "UYAP .udf dosya formatı için elle yazılmış okuyucu kütüphane + udfdump aracı"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
